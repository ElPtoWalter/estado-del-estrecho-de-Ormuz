name: Actualizar estado de Ormuz
run-name: ${{ inputs.recovery_request_id && format('Recuperación externa {0}', inputs.recovery_request_id) || 'Actualizar estado de Ormuz' }}

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      recovery_request_id:
        description: "External recovery correlation UUID (empty for a manual update)"
        required: false
        type: string
      recovery_expected_verified_at:
        description: "Public V7 verified_at observed by the external coordinator"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ormuz-content-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Descargar repositorio completo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Evitar recuperación duplicada dentro del bloqueo de escritura
        id: recovery
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          RECOVERY_REQUEST_ID: ${{ inputs.recovery_request_id }}
          RECOVERY_EXPECTED: ${{ inputs.recovery_expected_verified_at }}
        run: python recovery_preflight.py

      - name: Comprobar sintaxis de herramientas críticas
        if: steps.recovery.outputs.should_run == 'true'
        run: |
          python -m py_compile \
            update_status.py \
            straitwatch_core.py \
            operational_intelligence_v7.py \
            postprocess_evidence.py \
            maintenance_common.py \
            evidence_guard.py \
            repair_html.py \
            build_sitemap.py \
            validate_site.py \
            generate_health.py \
            remote_smoke_test.py

      - name: Conservar línea base anterior
        if: steps.recovery.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f status.json
          cp status.json "${{ runner.temp }}/status-before.json"
          [ ! -f history.json ] || cp history.json "${{ runner.temp }}/history-before.json"
          [ ! -f sitemap.xml ] || cp sitemap.xml "${{ runner.temp }}/sitemap-before.xml"

      - name: Comprobar fuentes y actualizar datos
        if: steps.recovery.outputs.should_run == 'true'
        env:
          CHANGE_FILE: ${{ runner.temp }}/ormuz-change.json
        run: python update_status.py

      - name: Conservar evidencias y preparar portadas
        if: steps.recovery.outputs.should_run == 'true'
        run: |
          if [ -f postprocess_evidence.py ]; then
            python postprocess_evidence.py
          else
            echo "postprocess_evidence.py no existe; se omite."
          fi

      - name: Aplicar cortafuegos editorial
        if: steps.recovery.outputs.should_run == 'true'
        id: editorial
        env:
          CHANGE_FILE: ${{ runner.temp }}/ormuz-change.json
        run: |
          python evidence_guard.py \
            --status status.json \
            --previous "${{ runner.temp }}/status-before.json" \
            --review "${{ runner.temp }}/editorial-review.json" \
            --aliases source-registry.json \
            --change-file "$CHANGE_FILE" \
            --rollback-unsafe

      - name: Generar verdad canónica V7, eventos y verificación
        if: steps.recovery.outputs.should_run == 'true'
        run: python operational_intelligence_v7.py

      - name: Sincronizar parte y RSS con la evaluación canónica
        if: steps.recovery.outputs.should_run == 'true'
        run: |
          python refresh_publication.py
          python canonical_publication.py --require-fresh

      - name: Auditar relevancia y trazabilidad sin reclasificar
        if: steps.recovery.outputs.should_run == 'true'
        run: python editorial_evidence_audit.py --output "${{ runner.temp }}/evidence-audit.json"

      - name: Regenerar sitemap desde todos los HTML públicos
        if: steps.recovery.outputs.should_run == 'true'
        run: python build_sitemap.py --root .

      - name: Generar estado técnico público
        if: steps.recovery.outputs.should_run == 'true'
        run: python generate_health.py --root .

      - name: Validar toda la salida antes del commit
        if: steps.recovery.outputs.should_run == 'true'
        run: |
          python validate_site.py \
            --root . \
            --report "${{ runner.temp }}/validation-report.json"

      - name: Preparar diagnóstico descargable
        if: always() && steps.recovery.outputs.should_run == 'true'
        shell: bash
        run: |
          set -u
          mkdir -p "${{ runner.temp }}/ormuz-diagnostics"
          for file in \
            "${{ runner.temp }}/validation-report.json" \
            "${{ runner.temp }}/editorial-review.json" \
            "${{ runner.temp }}/ormuz-change.json" \
            "${{ runner.temp }}/evidence-audit.json" \
            status.json health.json events.json operational-intelligence.json sitemap.xml; do
            [ ! -f "$file" ] || cp "$file" "${{ runner.temp }}/ormuz-diagnostics/"
          done
          git status --short > "${{ runner.temp }}/ormuz-diagnostics/git-status.txt" || true

      - name: Subir diagnóstico de la ejecución
        if: always() && steps.recovery.outputs.should_run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostico-ormuz-${{ github.run_number }}
          path: ${{ runner.temp }}/ormuz-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar cambios validados
        if: steps.recovery.outputs.should_run == 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python commit_generated.py monitor
          git commit -m "Actualizar estado, evidencias y publicación de Ormuz"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Canonical notifications are delivered by deploy-public only after HTTP proof.
      # No search-engine submissions are performed by the recovery pipeline.
