name: Fase 1 Newsroom CI

on:
  push:
    branches: [main, codex/phase1-closure-ormuz, phase2a-video-intelligence, codex/observatorio-auditoria-20261023]
    paths:
      - "**.py"
      - "**.cjs"
      - "source-registry.json"
      - "editorial-context.json"
      - "PHASE2_VIDEO_CONTRACT.md"
      - "PHASE2A_VIDEO_INTELLIGENCE.md"
      - "video-rules.json"
      - ".github/workflows/**.yml"
  pull_request:
    branches: [main]
    paths:
      - "publication_quality.py"
      - "adsense_checks.py"
      - "ads.txt"
      - "**.html"
      - "remote_smoke_test.py"
      - "original_research.py"
      - "test_adsense_original.py"
      - "drafts/adsense-20261024/**"
      - "drafts/historiales-20261024/**"
      - "test_history_editorial.py"
      - "history_public_candidate.py"
      - "history_release.py"
      - "energy_data.py"
      - "energy_editorial.py"
      - "energy_release.py"
      - "test_energy_release.py"
      - "spain_data.py"
      - "spain_editorial.py"
      - "test_spain_editorial.py"
      - "spain_release.py"
      - "test_spain_release.py"
      - "seo_surface.py"
      - "indexation_audit.py"
      - "publisher_preparation.py"
      - "publisher-preparation.json"
      - "adsense-readiness-report.json"
      - "test_preflight_audit.py"
      - "docs/preflight-20261028/**"
      - "docs/PREFLIGHT_ADSENSE_2026-10-28.md"
      - "docs/IDENTIFICACION_Y_PRIVACIDAD_2026-10-28.md"
      - "search_console_report.py"
      - "test_seo_search_console.py"
      - "docs/SEO_SEARCH_CONSOLE_2026-10-27.md"
      - "docs/spain-release-20261026.json"
      - "drafts/spain-europe-20261025/**"
      - "docs/energy-release-20261025.json"
      - "test_energy_editorial.py"
      - "drafts/energy-flows-20261025/**"
      - "test_history_release.py"
      - "docs/history-release-20261024.json"
      - "test_history_public_candidate.py"
      - "drafts/legal-persona-fisica-20261024/**"
      - "editorial-context.json"
      - "journal_evidence.py"
      - "test_journal_revision.py"
      - "monetization.json"
      - "editorial-reviews.json"
      - "test_observatory_contracts.py"
      - "build_sitemap.py"
      - "monitor_report.py"
      - "public-ui.js"
      - "own_projects.py"
      - "test_own_projects.*"
      - "free_editorial_ai.py"
      - "straitwatch_core.py"
      - "source-registry.json"
      - "PHASE2_VIDEO_CONTRACT.md"
      - "PHASE2A_VIDEO_INTELLIGENCE.md"
      - "video-rules.json"
      - "phase2_video/**"
      - "pilot_phase2a_video.py"
      - "test_video_*.py"
      - "test_phase2a_pilot.py"
      - "operational_intelligence_v7.py"
      - "postprocess_evidence.py"
      - "generate_health.py"
      - "build_public_site.py"
      - "check_public_links.py"
      - "generate_daily_brief.py"
      - "test_post_deploy_navigation.py"
      - "test_straitwatch_core.py"
      - "test_free_editorial_ai.py"
      - "generate_daily_journal.py"
      - "test_daily_journal_v8.py"
      - "test_editorial_quality.py"
      - "pilot_gemini_phase1.py"
      - ".github/workflows/pilot-gemini-phase1.yml"
      - ".github/workflows/pilot-phase2a-video.yml"
      - ".github/workflows/phase1-newsroom-ci.yml"
      - ".github/workflows/update-status.yml"
      - ".github/workflows/diario-ormuz.yml"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compilar
        run: |
          python -m py_compile spain_data.py spain_editorial.py test_spain_editorial.py drafts/spain-europe-20261025/render_charts.py
          python -m py_compile spain_release.py test_spain_release.py
          python -m py_compile seo_surface.py search_console_report.py test_seo_search_console.py
          python -m py_compile indexation_audit.py publisher_preparation.py test_preflight_audit.py
          python -m py_compile energy_data.py energy_editorial.py energy_release.py test_energy_editorial.py test_energy_release.py drafts/energy-flows-20261025/render_charts.py
          python -m py_compile publication_quality.py free_editorial_ai.py generate_daily_journal.py pilot_gemini_phase1.py pilot_phase2a_video.py straitwatch_core.py operational_intelligence_v7.py postprocess_evidence.py generate_health.py build_public_site.py history_public_candidate.py history_release.py test_history_release.py test_history_public_candidate.py test_free_editorial_ai.py test_straitwatch_core.py phase2_video/*.py
      - name: Pruebas editoriales
        run: |
          python -m unittest discover -v
          python -m unittest discover -s tests -v
      - name: Pruebas de interfaz pública
        run: node --test test_public_ui.cjs test_own_projects.cjs
      - name: Construir y comprobar publicación sin anuncios
        run: |
          python build_public_site.py
          python check_public_links.py _site
          python adsense_checks.py --root _site
          python drafts/historiales-20261024/reproduce.py --check
          python history_public_candidate.py --check
          python history_release.py --check
          python energy_editorial.py --check
          python energy_release.py --check
          python history_public_candidate.py --build
          python check_public_links.py drafts/historiales-20261024/preview
          python adsense_checks.py --root drafts/historiales-20261024/preview
          python spain_editorial.py --check
          python spain_release.py --check
          python seo_surface.py --root _site
          python publisher_preparation.py --check
          python indexation_audit.py --public-root _site --output "${{ runner.temp }}/indexation-offline"
      - name: Conservar candidato público comprobado sin desplegar
        uses: actions/upload-artifact@v7
        with:
          name: candidato-publico-${{ github.event.pull_request.head.sha || github.sha }}
          path: _site/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Conservar evidencia de integridad separada del sitio
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-energia-${{ github.event.pull_request.head.sha || github.sha }}
          path: drafts/energy-flows-20261025/release-build-audit.json
          retention-days: 7
          if-no-files-found: error
