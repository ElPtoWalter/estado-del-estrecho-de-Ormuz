name: Fase 1 Newsroom CI

on:
  push:
    branches: [main, codex/phase1-closure-ormuz, phase2a-video-intelligence, phase2b-voice]
    paths:
      - "**.py"
      - "**.cjs"
      - "source-registry.json"
      - "PHASE2_VIDEO_CONTRACT.md"
      - "PHASE2A_VIDEO_INTELLIGENCE.md"
      - "PHASE2_VOICE_CONTRACT.md"
      - "PHASE2B_VOICE.md"
      - "video-rules.json"
      - "voice-rules.json"
      - ".github/workflows/**.yml"
  pull_request:
    branches: [main]
    paths:
      - "free_editorial_ai.py"
      - "straitwatch_core.py"
      - "source-registry.json"
      - "PHASE2_VIDEO_CONTRACT.md"
      - "PHASE2A_VIDEO_INTELLIGENCE.md"
      - "PHASE2_VOICE_CONTRACT.md"
      - "PHASE2B_VOICE.md"
      - "video-rules.json"
      - "voice-rules.json"
      - "phase2_video/**"
      - "phase2_voice/**"
      - "pilot_phase2a_video.py"
      - "pilot_phase2b_voice.py"
      - "test_video_*.py"
      - "test_voice_*.py"
      - "test_phase2a_pilot.py"
      - "test_phase2b_pilot.py"
      - "operational_intelligence_v7.py"
      - "postprocess_evidence.py"
      - "generate_health.py"
      - "build_public_site.py"
      - "test_straitwatch_core.py"
      - "test_free_editorial_ai.py"
      - "generate_daily_journal.py"
      - "test_daily_journal_v8.py"
      - "test_editorial_quality.py"
      - "pilot_gemini_phase1.py"
      - ".github/workflows/pilot-gemini-phase1.yml"
      - ".github/workflows/pilot-phase2a-video.yml"
      - ".github/workflows/pilot-phase2b-voice.yml"
      - ".github/workflows/phase1-newsroom-ci.yml"
      - ".github/workflows/update-status.yml"
      - ".github/workflows/diario-ormuz.yml"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compilar
        run: |
          python -m py_compile free_editorial_ai.py generate_daily_journal.py pilot_gemini_phase1.py pilot_phase2a_video.py pilot_phase2b_voice.py straitwatch_core.py operational_intelligence_v7.py postprocess_evidence.py generate_health.py build_public_site.py test_free_editorial_ai.py test_straitwatch_core.py phase2_video/*.py phase2_voice/*.py
      - name: Pruebas editoriales
        run: python -m unittest discover -v
      - name: Pruebas de interfaz pública
        run: node --test test_public_ui.cjs
