name: Vigilar frescura de publicación
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-watchdog
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verificar edad real, parte y edición por HTTP
        run: python watch_publication.py --report watchdog-report.json
      - name: Conservar diagnóstico sin publicarlo en Pages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watchdog-${{ github.run_id }}
          path: watchdog-report.json
          retention-days: 14
