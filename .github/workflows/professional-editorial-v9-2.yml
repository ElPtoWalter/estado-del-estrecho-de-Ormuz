name: Professionalizar Diario V9.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: professional-editorial-v9-2
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Parchear generador editorial
        run: python fix_professional_editorial_v9_2.py

      - name: Validar generador
        run: |
          python -m py_compile generate_daily_journal.py
          python -m unittest -v test_daily_journal_v8.py

      - name: Regenerar edición de hoy
        run: python generate_daily_journal.py --force

      - name: Limpiar edición y hemeroteca después de regenerar
        run: python fix_professional_editorial_v9_2.py --clean-only

      - name: Regenerar sitemap
        run: python build_sitemap.py --root .

      - name: Validar sitio
        run: |
          python validate_site.py --root . --report "${{ runner.temp }}/professional-v9-2-validation.json"

      - name: Auditoría de lenguaje público
        run: |
          ! grep -R -n -E \
            'Redacción automatizada|Automated newsroom|El texto se genera automáticamente|The text is generated automatically|Puntuación de novedad|Novelty score|Cómo se ha escrito esta edición|How this edition was produced|Crónica diaria automática|Daily automated|status\.json' \
            diario.html en-diary.html diario diary index.html en.html

      - name: Guardar cambios
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            generate_daily_journal.py \
            fix_professional_editorial_v9_2.py \
            .github/workflows/diario-ormuz.yml \
            diario.html \
            en-diary.html \
            diario \
            diary \
            index.html \
            en.html \
            sitemap.xml

          if git diff --cached --quiet; then
            echo "V9.2 ya estaba aplicada."
          else
            git commit -m "Corrige definitivamente la presentación editorial del Diario"
            git push
          fi
