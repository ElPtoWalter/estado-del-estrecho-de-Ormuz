name: Piloto manual · Fase 2B Voz

on:
  workflow_dispatch:
    inputs:
      confirm_paid_synthesis:
        description: Confirmo que esta ejecución consumirá créditos de ElevenLabs
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase2b-voice-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    if: ${{ inputs.confirm_paid_synthesis == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar la rama seleccionada
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas de Fase 2B
        run: |
          python -m py_compile pilot_phase2b_voice.py phase2_voice/*.py
          python -m unittest -v test_voice_package.py test_voice_render.py test_voice_validator.py test_phase2b_pilot.py

      - name: Comprobar configuración de ElevenLabs sin mostrar secretos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_ES: ${{ vars.ELEVENLABS_VOICE_ID_ES }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || { echo "::error::Falta el secreto ELEVENLABS_API_KEY"; exit 1; }
          test -n "$ELEVENLABS_VOICE_ID_ES" || { echo "::error::Falta la variable ELEVENLABS_VOICE_ID_ES"; exit 1; }

      - name: Ejecutar piloto aislado de Ormuz con ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_ES: ${{ vars.ELEVENLABS_VOICE_ID_ES }}
        run: python pilot_phase2b_voice.py --site ormuz --output-dir "${{ runner.temp }}/phase2b-voice"

      - name: Guardar exclusivamente los artefactos temporales del piloto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2b-voice-ormuz-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/phase2b-voice/video-package.json
            ${{ runner.temp }}/phase2b-voice/script.json
            ${{ runner.temp }}/phase2b-voice/voice-package.json
            ${{ runner.temp }}/phase2b-voice/audio-elevenlabs.wav
            ${{ runner.temp }}/phase2b-voice/audio-manifest.json
            ${{ runner.temp }}/phase2b-voice/validation-voice-package.json
            ${{ runner.temp }}/phase2b-voice/validation-audio.json
            ${{ runner.temp }}/phase2b-voice/preview.md
          if-no-files-found: error
          retention-days: 14
