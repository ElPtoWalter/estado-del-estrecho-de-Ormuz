name: Muestra manual · Guion claro 1.1 y h muda

on:
  workflow_dispatch:
    inputs:
      observed_free_at:
        description: Hora UTC de la observación manual del nivel gratuito
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pending3-plain-voice-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Una sola petición · sin fallback ni publicación
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          GEMINI_TTS_VOICE_ES: es-es-advisor-2
          OPENROUTER_API_KEY: ''
          OBSERVED_FREE_AT: ${{ inputs.observed_free_at }}
        run: python pilot_pending_plain_voice.py --repo . --output "${{ runner.temp }}/pending3-voice" --generate --observed-free-at "$OBSERVED_FREE_AT"
      - name: Conservar el candidato; la escucha humana sigue pendiente
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pending3-plain-ormuz-${{ github.run_id }}
          path: ${{ runner.temp }}/pending3-voice
          if-no-files-found: error
          retention-days: 14

