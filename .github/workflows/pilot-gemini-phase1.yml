name: Piloto Gemini · Fase 1

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rama experimental que se validará sin publicar
        required: true
        default: phase1-gemini-newsroom
        type: string
  pull_request:
    types: [synchronize]
    paths:
      - ".github/phase1-gemini-pilot.authorized-20260927"

permissions:
  contents: read

concurrency:
  group: pilot-gemini-phase1-${{ inputs.ref || github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  controlled-pilot:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase1-gemini-newsroom' && github.repository == 'ElPtoWalter/estado-del-estrecho-de-Ormuz')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la rama seleccionada
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validar sintaxis y pruebas sin claves
        env:
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: |
          python -m py_compile free_editorial_ai.py generate_daily_journal.py pilot_gemini_phase1.py test_free_editorial_ai.py
          python -m unittest discover -v

      - name: Comprobar conexión mínima con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python pilot_gemini_phase1.py
