name: Piloto Gemini · Fase 1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Rama experimental que se validará sin publicar
        required: true
        default: codex/phase1-closure-ormuz
        type: string

permissions:
  contents: read

concurrency:
  group: pilot-gemini-phase1-${{ github.event.pull_request.number || inputs.ref }}
  cancel-in-progress: true

jobs:
  controlled-pilot:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la rama seleccionada
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref }}
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validar sintaxis y pruebas sin claves
        env:
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: |
          python -m py_compile free_editorial_ai.py generate_daily_journal.py pilot_gemini_phase1.py test_free_editorial_ai.py
          python -m unittest discover -v

      - name: Comparar LOCAL con Gemini sobre el mismo paquete factual real
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ""
        run: python pilot_gemini_phase1.py --output "${{ runner.temp }}/ormuz-pilot-report.json"

      - name: Subir informe aislado del piloto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piloto-ormuz-${{ github.run_number }}
          path: ${{ runner.temp }}/ormuz-pilot-report.json
          if-no-files-found: warn
          retention-days: 14
