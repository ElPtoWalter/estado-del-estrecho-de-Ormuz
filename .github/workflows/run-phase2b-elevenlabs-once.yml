name: Piloto único ElevenLabs · Ormuz

on:
  push:
    branches: [phase2b-elevenlabs-pilot-20260930]

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validar Fase 2B sin consumir créditos
        run: |
          python -m py_compile pilot_phase2b_voice.py phase2_voice/*.py
          python -m unittest -v test_voice_package.py test_voice_render.py test_voice_validator.py test_phase2b_pilot.py
      - name: Comprobar secretos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_ES: ${{ secrets.ELEVENLABS_VOICE_ID_ES }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || { echo "::error::Falta ELEVENLABS_API_KEY"; exit 1; }
          test -n "$ELEVENLABS_VOICE_ID_ES" || { echo "::error::Falta ELEVENLABS_VOICE_ID_ES"; exit 1; }
      - name: Sintetizar un único candidato real
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID_ES: ${{ secrets.ELEVENLABS_VOICE_ID_ES }}
        run: python pilot_phase2b_voice.py --site ormuz --output-dir "${{ runner.temp }}/phase2b-voice"
      - name: Guardar los ocho artefactos aprobados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2b-elevenlabs-ormuz-once
          path: |
            ${{ runner.temp }}/phase2b-voice/video-package.json
            ${{ runner.temp }}/phase2b-voice/script.json
            ${{ runner.temp }}/phase2b-voice/voice-package.json
            ${{ runner.temp }}/phase2b-voice/audio-elevenlabs.wav
            ${{ runner.temp }}/phase2b-voice/audio-manifest.json
            ${{ runner.temp }}/phase2b-voice/validation-voice-package.json
            ${{ runner.temp }}/phase2b-voice/validation-audio.json
            ${{ runner.temp }}/phase2b-voice/preview.md
          if-no-files-found: error
          retention-days: 14