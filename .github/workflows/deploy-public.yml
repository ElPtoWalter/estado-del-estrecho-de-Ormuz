name: Publicar superficie segura

on:
  push:
    branches: [main]

  workflow_dispatch:

  workflow_run:
    workflows:
      - "Actualizar estado de Ormuz"
      - "El Diario de Ormuz"
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: secure-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Identificar revisión exacta del artefacto
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Construir superficie pública
        run: |
          python canonical_publication.py
          python build_public_site.py
          python check_public_links.py _site

      - name: Comprobar que no se publica código ni datos internos
        run: |
          test ! -e _site/status.json
          test ! -e _site/history.json
          test ! -e _site/update_status.py
          test ! -e _site/config.json
          test ! -e _site/operational-intelligence.json
          test ! -e _site/social-studio.js
          test ! -e _site/widget.js
          test ! -e _site/.github
          test ! -e _site/_redirects

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto público
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Descargar herramientas de comprobación
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.revision }}

      - name: Verificar las páginas ya publicadas
        run: python remote_smoke_test.py --attempts 3 --delay 10 --timeout 10 --history-release --energy-release --spain-release

      - name: Probar que el commit y la evaluación están publicados
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.revision }}
        run: |
          python - <<'PY'
          import os, time
          from canonical_publication import canonical
          from canonical_notifications import fetch_public, verify_public
          for attempt in range(6):
              try:
                  verify_public(fetch_public("https://estrechoormuz.com/publication-health.xml"), canonical("."), os.environ["EXPECTED_COMMIT"])
                  break
              except Exception:
                  if attempt == 5: raise
                  time.sleep(10)
          PY

  notify:
    needs: [build, deploy]
    if: vars.CANONICAL_NOTIFICATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: ormuz-content-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Entregar cambios V7 ya publicados y guardar recibos por canal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.revision }}
        run: |
          set +e
          python canonical_notifications.py --commit "$EXPECTED_COMMIT" --send
          result=$?
          set -e
          if [ -f notification-delivery.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- notification-delivery.json
            if ! git diff --cached --quiet; then
              git commit -m "Guardar recibos de avisos V7"
              git push
            fi
          fi
          exit "$result"
      - name: Conservar recibos para recuperar un fallo de persistencia
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recibos-avisos-${{ github.run_id }}
          path: notification-delivery.json
          if-no-files-found: ignore
          retention-days: 14
