name: Instalar Professional Security V9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Limpiar superficie editorial pública
        run: python professionalize_surface_v9.py

      - name: Validar constructor seguro
        run: python build_public_site.py

      - name: Comprobar diff
        run: |
          git diff --check
          git status --short

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_public_site.py professionalize_surface_v9.py .github/workflows/deploy-public.yml ./*.html
          git add diario/*.html diary/*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Professionaliza la superficie pública y separa el motor privado"
            git push
          fi
